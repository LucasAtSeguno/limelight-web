name: Update review data

on:
  # Run on a schedule — 9am and 3pm UTC on weekdays
  # Adjust times to suit your timezone (UTC-5 EST: 9am EST = 14:00 UTC, 3pm EST = 20:00 UTC)
  schedule:
    - cron: '0 14,20 * * 1-5'

  # Allow manual trigger from the dashboard Update button or GitHub UI
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: node update.js

      - name: Trigger Netlify redeploy
        if: success()
        run: |
          curl -s -X POST "${{ secrets.NETLIFY_HOOK_URL }}"
          echo "Netlify redeploy triggered"
