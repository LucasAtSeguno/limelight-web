name: Update review data

on:
  # Triggered on demand via the dashboard Update button or GitHub Actions UI
  # Scheduled runs have been disabled to conserve Netlify deploy credits
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: node update.js

