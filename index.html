<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limelight — Review Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:           #f0efe9;
    --surface:      #ffffff;
    --surface-2:    #e9e8e2;
    --border:       #dddcd5;
    --border-strong:#c4c2ba;
    --text-primary: #1a1916;
    --text-secondary:#5c5b54;
    --text-tertiary: #9a988f;
    --accent:       #2d5a27;
    --accent-light: #e5efe4;
    --accent-mid:   #4a8c42;
    --star-5: #3a7d2e;
    --star-4: #7ab648;
    --star-3: #e6a817;
    --star-2: #d46b1a;
    --star-1: #c43b2a;
    --up:     #2d5a27;
    --up-bg:  #e5efe4;
    --down:   #8b2218;
    --down-bg:#fce8e6;
    --amber:  #92600a;
    --amber-bg:#fef3e2;
    --neutral-bg: #eeede8;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --radius: 10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text-primary);
    font-size: 18px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Page shell ── */
  .page { max-width: 1600px; margin: 0 auto; padding: 0 48px 80px; }

  /* ── Top bar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 36px 0 28px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .topbar-left { display: flex; align-items: baseline; gap: 16px; }
  .wordmark {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #6abf2e;
    text-shadow: 0 0 24px rgba(106, 191, 46, 0.35);
  }
  .topbar-divider { width: 1px; height: 16px; background: var(--border-strong); align-self: center; }
  .topbar-subtitle {
    font-size: 16px;
    color: var(--text-tertiary);
    font-weight: 300;
  }
  .sync-meta {
    text-align: right;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-tertiary);
    line-height: 1.9;
  }
  .sync-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }
  .sync-dot.fresh { background: var(--accent-mid); }
  .sync-dot.stale { background: var(--amber); }

  /* ── Unreplied hero ── */
  .unreplied-hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 36px;
    margin-bottom: 36px;
  }
  .unreplied-hero-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .unreplied-hero-left { display: flex; align-items: baseline; gap: 14px; }
  .unreplied-count {
    font-size: 64px;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--amber);
  }
  .unreplied-count.zero { color: var(--accent-mid); }
  .unreplied-count-label {
    font-size: 18px;
    font-weight: 400;
    color: var(--text-secondary);
  }
  .unreplied-checked-at {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-tertiary);
  }
  .unreplied-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 12px;
  }
  .unreplied-app-group {}
  .unreplied-app-label {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 8px;
    padding-left: 2px;
  }
  .unreplied-card {
    background: var(--surface-2);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 10px;
    border-left: 3px solid var(--border-strong);
  }
  .unreplied-card:last-child { margin-bottom: 0; }
  .unreplied-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 5px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .unreplied-store { font-size: 16px; font-weight: 500; }
  .unreplied-meta-right { display: flex; align-items: center; gap: 8px; }
  .unreplied-date { font-family: var(--mono); font-size: 13px; color: var(--text-tertiary); }
  .unreplied-text { font-size: 14px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 7px; }
  .unreplied-text.rating-only { font-style: italic; color: var(--text-tertiary); }
  .unreplied-link {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .unreplied-link:hover { text-decoration: underline; }
  .unreplied-all-clear {
    font-size: 16px;
    color: var(--text-tertiary);
    font-style: italic;
    padding: 6px 2px;
  }

  /* Star pips */
  .star-pip { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 1px; vertical-align: middle; }
  .pip-filled { background: #e6a817; }
  .pip-empty  { background: var(--border-strong); }

  /* ── App cards grid ── */
  .section-label {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 14px;
  }

  .apps-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 40px;
  }
  @media (max-width: 900px) { .apps-grid { grid-template-columns: 1fr; } }
  @media (min-width: 600px) and (max-width: 900px) { .apps-grid { grid-template-columns: repeat(2, 1fr); } }

  .app-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .app-card-head {
    padding: 24px 26px 18px;
    border-bottom: 1px solid var(--border);
  }
  .app-name-row { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-bottom: 10px; }
  .app-name { font-size: 18px; font-weight: 500; }
  .app-url {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-tertiary);
    background: var(--surface-2);
    padding: 2px 7px;
    border-radius: 4px;
    text-decoration: none;
  }
  .app-url:hover { color: var(--accent); }
  .app-stats { display: flex; align-items: baseline; gap: 10px; }
  .rating-num {
    font-size: 38px;
    font-weight: 300;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .rating-star { color: #e6a817; font-size: 18px; }
  .total-count { font-family: var(--mono); font-size: 14px; color: var(--text-secondary); }
  .change-pill {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 4px;
  }
  .pill-up      { background: var(--up-bg);      color: var(--up); }
  .pill-down    { background: var(--down-bg);     color: var(--down); }
  .pill-neutral { background: var(--neutral-bg);  color: var(--text-tertiary); }

  .app-card-body { padding: 16px 20px; }

  /* Stars */
  .stars-label {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 10px;
  }
  .star-row {
    display: grid;
    grid-template-columns: 18px 1fr 44px 52px;
    gap: 5px 8px;
    align-items: center;
    margin-bottom: 10px;
  }
  .star-lbl { font-family: var(--mono); font-size: 13px; color: var(--text-secondary); text-align: right; }
  .bar-track { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .bar-fill  { height: 100%; border-radius: 99px; }
  .bar-5 { background: var(--star-5); }
  .bar-4 { background: var(--star-4); }
  .bar-3 { background: var(--star-3); }
  .bar-2 { background: var(--star-2); }
  .bar-1 { background: var(--star-1); }
  .star-cnt  { font-family: var(--mono); font-size: 13px; color: var(--text-primary); text-align: right; }
  .star-chg  { font-family: var(--mono); font-size: 11px; text-align: right; }
  .star-chg.up   { color: var(--up); }
  .star-chg.down { color: var(--down); }
  .star-chg.flat { color: var(--text-tertiary); }

  /* Snippets */
  .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .snippet { padding: 12px 14px; background: var(--surface-2); border-radius: 7px; margin-bottom: 9px; border-left: 2px solid var(--border-strong); }
  .snippet:last-child { margin-bottom: 0; }
  .snippet-text { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }
  .snippet-meta { font-family: var(--mono); font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }

  /* ── History ── */
  .history-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    margin-bottom: 14px;
  }
  .history-toggle:hover .section-label { color: var(--text-secondary); }
  .chevron {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-tertiary);
    transition: transform 0.2s;
    display: inline-block;
  }
  .chevron.collapsed { transform: rotate(-90deg); }

  .history-table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 32px;
  }
  .history-table-wrap.collapsed { display: none; }
  .history-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 14px; }
  thead th {
    padding: 14px 20px;
    text-align: left;
    color: var(--text-tertiary);
    font-weight: 400;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    background: var(--surface-2);
  }
  tbody td {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    color: var(--text-primary);
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--surface-2); }
  td.date-col  { color: var(--text-secondary); }
  td.chg-up    { color: var(--up); }
  td.chg-down  { color: var(--down); }
  td.chg-flat  { color: var(--text-tertiary); }

  /* ── Empty / error states ── */
  .state-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 48px 32px;
    text-align: center;
  }
  .state-box h2 { font-size: 17px; font-weight: 500; margin-bottom: 8px; }
  .state-box p  { font-size: 13px; color: var(--text-secondary); line-height: 1.6; max-width: 480px; margin: 0 auto; }
  /* ── Update button ── */
  .update-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .update-btn:hover { background: #1e3d1a; }
  .update-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .update-progress {
    display: none;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    background: var(--accent-light);
    border: 1px solid #c5dac2;
    border-radius: 8px;
    font-size: 14px;
    color: #1e3d1a;
    margin-top: 12px;
  }
  .update-progress.visible { display: flex; }
  .update-progress.error { background: #fce8e6; border-color: #f0c4c0; color: #8b2218; }
  .progress-spinner {
    width: 16px; height: 16px;
    border: 2px solid #c5dac2;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .state-box code {
    font-family: var(--mono);
    background: var(--surface-2);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="page">

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="wordmark">Limelight</span>
      <div class="topbar-divider"></div>
      <span class="topbar-subtitle">Shopify App Store · Review Dashboard</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <div class="sync-meta" id="sync-meta">—</div>
      <button class="update-btn" id="update-btn" onclick="triggerUpdate()">&#8635; Update</button>
    </div>
  </div>

  <!-- Update progress -->
  <div class="update-progress" id="update-progress">
    <div class="progress-spinner" id="progress-spinner"></div>
    <span id="progress-text"></span>
  </div>

  <!-- Main content -->
  <div id="main-content">
    <div class="state-box">
      <h2>No data loaded</h2>
      <p>Place a Limelight export file named <code>limelight-data.json</code> in the same folder as this file, then reload the page.</p>
    </div>
  </div>

</div>

<script>
const APPS = [
  { id: 'seguno',                   name: 'Seguno Email Marketing', url: 'https://apps.shopify.com/seguno/reviews' },
  { id: 'bulk-discount-generator', name: 'Bulk Discount Code Bot', url: 'https://apps.shopify.com/bulk-discount-generator/reviews' },
  { id: 'canva-connect',           name: 'Canva Connect',          url: 'https://apps.shopify.com/canva-connect/reviews' },
];

/* ── Helpers ── */
function pill(diff) {
  if (diff === null) return '<span class="change-pill pill-neutral">first</span>';
  if (diff > 0) return `<span class="change-pill pill-up">+${diff}</span>`;
  if (diff < 0) return `<span class="change-pill pill-down">${diff}</span>`;
  return '<span class="change-pill pill-neutral">±0</span>';
}
function starChg(diff) {
  if (diff === null) return '<span class="star-chg flat">—</span>';
  if (diff > 0) return `<span class="star-chg up">+${diff}</span>`;
  if (diff < 0) return `<span class="star-chg down">${diff}</span>`;
  return '<span class="star-chg flat">—</span>';
}
function starPips(n) {
  return [1,2,3,4,5].map(i =>
    `<span class="star-pip ${i <= n ? 'pip-filled' : 'pip-empty'}"></span>`
  ).join('');
}
function dataAge(checkedAt) {
  if (!checkedAt) return null;
  const d = new Date(checkedAt);
  if (isNaN(d)) return null;
  return (Date.now() - d.getTime()) / 1000 / 60 / 60; // hours
}

/* ── Unreplied hero ── */
function renderUnreplied(unreplied) {
  if (!unreplied || !unreplied.results) {
    return `<div class="unreplied-hero">
      <div class="unreplied-hero-header">
        <div class="unreplied-hero-left">
          <span class="unreplied-count zero">—</span>
          <span class="unreplied-count-label">unreplied reviews</span>
        </div>
      </div>
      <p style="font-size:13px;color:var(--text-tertiary);font-style:italic;">No unreplied check has been run yet.</p>
    </div>`;
  }

  const results = unreplied.results;
  const checkedAt = unreplied.checkedAt || '';
  let totalCount = 0;
  APPS.forEach(a => { totalCount += (results[a.id] || []).length; });

  const groups = APPS.map(app => {
    const reviews = results[app.id] || [];
    if (reviews.length === 0) {
      return `<div class="unreplied-app-group">
        <div class="unreplied-app-label">${app.name}</div>
        <div class="unreplied-all-clear">No unreplied reviews in the last 5 pages ✓</div>
      </div>`;
    }
    const cards = reviews.map(r => `
      <div class="unreplied-card">
        <div class="unreplied-card-header">
          <span class="unreplied-store">${r.store}</span>
          <div class="unreplied-meta-right">
            <span>${starPips(r.stars)}</span>
            <span class="unreplied-date">${r.date}</span>
          </div>
        </div>
        <div class="unreplied-text${r.ratingOnly ? ' rating-only' : ''}">${r.ratingOnly ? 'Rating only — no review text.' : r.text}</div>
        <a class="unreplied-link" href="${r.url}" target="_blank">Open review ↗</a>
      </div>`).join('');
    return `<div class="unreplied-app-group">
      <div class="unreplied-app-label">${app.name} — ${reviews.length} unreplied</div>
      ${cards}
    </div>`;
  }).join('');

  return `<div class="unreplied-hero">
    <div class="unreplied-hero-header">
      <div class="unreplied-hero-left">
        <span class="unreplied-count${totalCount === 0 ? ' zero' : ''}">${totalCount}</span>
        <span class="unreplied-count-label">unreplied review${totalCount !== 1 ? 's' : ''} across 3 apps</span>
      </div>
      ${checkedAt ? `<span class="unreplied-checked-at">Checked ${checkedAt}</span>` : ''}
    </div>
    <div class="unreplied-grid">${groups}</div>
  </div>`;
}

/* ── App card ── */
function renderApp(app, current, previous) {
  const maxBar = Math.max(...Object.values(current.stars));
  const totalDiff = previous ? current.total - previous.total : null;
  const rows = [5,4,3,2,1].map(s => {
    const cnt = current.stars[s] || 0;
    const pct = maxBar > 0 ? (cnt / maxBar * 100).toFixed(1) : 0;
    const diff = previous ? cnt - (previous.stars[s] || 0) : null;
    return `<div class="star-row">
      <span class="star-lbl">${s}</span>
      <div class="bar-track"><div class="bar-fill bar-${s}" style="width:${pct}%"></div></div>
      <span class="star-cnt">${cnt.toLocaleString()}</span>
      ${starChg(diff)}
    </div>`;
  }).join('');

  const snippets = (current.snippets || []).map(s => `
    <div class="snippet">
      <div class="snippet-text">${s.text}</div>
      <div class="snippet-meta">
        ${s.stars ? starPips(s.stars) + '&nbsp;' : ''}${s.meta}
      </div>
    </div>`).join('');

  return `<div class="app-card">
    <div class="app-card-head">
      <div class="app-name-row">
        <span class="app-name">${app.name}</span>
        <a class="app-url" href="${app.url}" target="_blank">${app.url.replace('https://','').replace('/reviews','')}</a>
      </div>
      <div class="app-stats">
        <span class="rating-num">${current.rating ?? '—'}</span>
        <span class="rating-star">★</span>
        <span class="total-count">${(current.total ?? 0).toLocaleString()} reviews</span>
        ${pill(totalDiff)}
      </div>
    </div>
    <div class="app-card-body">
      <div class="stars-label">Star breakdown</div>
      ${rows}
      ${snippets ? `<hr class="divider"><div class="stars-label">Recent reviews</div>${snippets}` : ''}
    </div>
  </div>`;
}

/* ── History table ── */
function renderHistory(snapshots) {
  if (snapshots.length < 2) return '';
  const sorted = snapshots.slice().reverse();
  const heads = APPS.map(a => `<th>${a.name}</th><th>chg</th>`).join('');
  const rows = sorted.map((snap, i) => {
    const prev = sorted[i + 1];
    const cells = APPS.map(a => {
      const cur = snap.apps[a.id]; const p = prev ? prev.apps[a.id] : null;
      const total = cur ? cur.total.toLocaleString() : '—';
      let chg = '<td class="chg-flat">—</td>';
      if (cur && p) {
        const d = cur.total - p.total;
        chg = d > 0 ? `<td class="chg-up">+${d}</td>` : d < 0 ? `<td class="chg-down">${d}</td>` : `<td class="chg-flat">±0</td>`;
      }
      return `<td>${total}</td>${chg}`;
    }).join('');
    return `<tr><td class="date-col">${snap.label}</td>${cells}</tr>`;
  }).join('');

  return `
    <div class="history-toggle" id="history-toggle">
      <span class="chevron" id="history-chevron">▼</span>
      <span class="section-label">Snapshot history</span>
    </div>
    <div class="history-table-wrap" id="history-table">
      <div class="history-scroll">
        <table>
          <thead><tr><th>Date</th>${heads}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

/* ── Sync meta ── */
function renderSyncMeta(snapshots, unreplied) {
  const latest = snapshots[snapshots.length - 1];
  const hours = dataAge(unreplied?.checkedAt);
  const fresh = hours !== null && hours < 24;
  const dotClass = hours === null ? '' : fresh ? 'fresh' : 'stale';
  const dotHtml = dotClass ? `<span class="sync-dot ${dotClass}"></span>` : '';

  return `${dotHtml}${latest.label} · ${snapshots.length} snapshot${snapshots.length !== 1 ? 's' : ''}`;
}

/* ── Main render ── */
function render(data) {
  const snapshots = data.snapshots?.snapshots || [];
  const unreplied = data.unreplied || null;

  if (snapshots.length === 0) return;

  const latest = snapshots[snapshots.length - 1];
  const previous = snapshots.length > 1 ? snapshots[snapshots.length - 2] : null;

  document.getElementById('sync-meta').innerHTML = renderSyncMeta(snapshots, unreplied);

  const appsHtml = APPS.map(app =>
    renderApp(app, latest.apps[app.id], previous ? previous.apps[app.id] : null)
  ).join('');

  document.getElementById('main-content').innerHTML = `
    ${renderUnreplied(unreplied)}
    <div class="section-label" style="margin-bottom:14px;">App reviews</div>
    <div class="apps-grid">${appsHtml}</div>
    ${renderHistory(snapshots)}
  `;

  // Wire up history toggle
  const toggle = document.getElementById('history-toggle');
  if (toggle) {
    toggle.addEventListener('click', () => {
      const table = document.getElementById('history-table');
      const chevron = document.getElementById('history-chevron');
      const collapsed = table.classList.toggle('collapsed');
      chevron.classList.toggle('collapsed', collapsed);
    });
  }
}

/* ── Load data from GitHub API ── */
// Uses the GitHub API rather than raw CDN URL to avoid caching issues.
// The API always returns the current committed version immediately.
const GITHUB_API_URL = 'https://api.github.com/repos/LucasAtSeguno/limelight-web/contents/limelight-data.json';

function loadData() {
  return fetch(`${GITHUB_API_URL}`, {
    headers: {
      'Accept': 'application/vnd.github.raw+json',
      'X-GitHub-Api-Version': '2022-11-28',
    }
  })
    .then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    });
}

loadData()
  .then(data => render(data))
  .catch(() => {
    // Leave the "no data" state box in place
  });

/* ── Update button ── */
async function triggerUpdate() {
  const btn = document.getElementById('update-btn');
  const bar = document.getElementById('update-progress');
  const spinner = document.getElementById('progress-spinner');
  const text = document.getElementById('progress-text');

  btn.disabled = true;
  bar.className = 'update-progress visible';
  spinner.style.display = 'block';
  text.textContent = 'Fetching fresh review data…';

  try {
    // Step 1 — trigger the workflow (returns immediately)
    const res = await fetch('/.netlify/functions/trigger-update', { method: 'POST' });
    const rawText = await res.text();
    let result;
    try {
      result = JSON.parse(rawText);
    } catch(e) {
      throw new Error(`Function returned non-JSON (HTTP ${res.status}): ${rawText.slice(0, 200)}`);
    }
    if (result.error) throw new Error(result.error);

    // Step 2 — count down then reload with fresh data
    // Workflow takes ~30s; we wait 45s to ensure GitHub API has the new file
    const WAIT_SECONDS = 45;
    for (let i = WAIT_SECONDS; i > 0; i--) {
      text.textContent = `Updating… reloading in ${i}s`;
      await new Promise(r => setTimeout(r, 1000));
    }

    // Fetch fresh data and re-render
    text.textContent = 'Loading fresh data…';
    const fresh = await loadData();
    render(fresh);

    spinner.style.display = 'none';
    text.textContent = 'Update complete!';
    setTimeout(() => { bar.className = 'update-progress'; }, 2000);

  } catch (err) {
    bar.className = 'update-progress visible error';
    spinner.style.display = 'none';
    text.textContent = `Update failed: ${err.message}`;
  }

  btn.disabled = false;
}
</script>
